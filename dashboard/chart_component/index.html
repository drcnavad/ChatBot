<!doctype html>
<html><head><meta charset="utf-8"><script src="plotly.min.js"></script>
<style>html,body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif}#c{width:100%;position:relative}
.lg{position:absolute;pointer-events:none;font-size:11px;color:#334155;background:rgba(255,255,255,.85);padding:1px 4px;border-radius:3px;white-space:nowrap;z-index:5}
.lg b{font-weight:600}.lg .up{color:#16a34a}.lg .dn{color:#dc2626}
.ch{position:absolute;pointer-events:none;z-index:4;display:none}
#chh{border-top:1px dotted #64748b;height:0}#chv{border-left:1px dotted #64748b;width:0}
#rng{position:absolute;left:10px;top:6px;z-index:6;display:flex;gap:4px}
#rng button{font:600 12px Inter,system-ui,sans-serif;color:#0f172a;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;padding:2px 8px;cursor:pointer}
#rng button.on{background:#5eead4;border-color:#14b8a6}
#ask{position:absolute;right:80px;top:40px;z-index:7;display:none;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
#ask button{margin-left:6px;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;background:#f8fafc;padding:2px 8px;cursor:pointer}
#ask button.del{background:#dc2626;color:#fff;border-color:#dc2626}
#chy{background:#334155;color:#fff;font-size:10px;padding:1px 4px;border-radius:2px;transform:translateY(-50%)}</style></head>
<body><div id="c"><div id="chh" class="ch"></div><div id="chv" class="ch"></div><div id="chy" class="ch"></div><div id="rng"></div><div id="ask"><span id="askt"></span><button class="del" id="askyes">Delete</button><button id="askno">Cancel</button></div></div><script>
// The stock chart as a Streamlit component: draws the figure, sends your own shapes back (to be saved per stock)
// and rescales the price axis to the candles in view. Streamlit's component protocol, no extra JS library.
const div = document.getElementById("c");
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
let spec = null, ohlc = null, busy = false, K = 10, curView = "1Y", mode = "Candles", intraday = false;
function mine() { return (div.layout.shapes || []).filter(s => s.name !== "sys").map(s => JSON.parse(JSON.stringify(s))); }
function rescale() {
  const r = div.layout.xaxis.range; if (!r || !ohlc) return;
  const a = new Date(r[0]), b = new Date(r[1]); let lo = Infinity, hi = -Infinity;
  ohlc.x.forEach((x, i) => { const d = new Date(x); if (d >= a && d <= b) { lo = Math.min(lo, ohlc.low[i]); hi = Math.max(hi, ohlc.high[i]); } });
  const upd = {};
  if (lo < hi) { const p = (hi - lo) * 0.06; upd["yaxis.range"] = [lo - p, hi + p]; }
  // the lower panels too: volume from 0 to the highest bar in view, RSI keeps 30-70 in view, the others fit with a pad
  const per = {};
  (div._fullData || []).forEach(t => {
    const ax = t.yaxis || "y"; if (ax === "y" || !t.x || !t.y || t.visible === false) return;
    const e = per[ax] = per[ax] || {lo: Infinity, hi: -Infinity, vol: false, rsi: false};
    if (t.name === "Volume") e.vol = true; if (t.name === "RSI") e.rsi = true;
    for (let i = 0; i < t.x.length; i++) { const d = new Date(t.x[i]), v = +t.y[i];
      if (d >= a && d <= b && v === v && t.y[i] !== null) { e.lo = Math.min(e.lo, v); e.hi = Math.max(e.hi, v); } }
  });
  Object.entries(per).forEach(([ax, e]) => {
    if (!(e.lo <= e.hi)) return;
    const key = "yaxis" + ax.slice(1) + ".range";
    if (e.vol) upd[key] = [0, e.hi * 1.08];
    else { if (e.rsi) { e.lo = Math.min(e.lo, 30); e.hi = Math.max(e.hi, 70); }
      const p = Math.max((e.hi - e.lo) * 0.08, 1e-9); upd[key] = [e.lo - p, e.hi + p]; }
  });
  if (Object.keys(upd).length) { busy = true; Plotly.relayout(div, upd).then(() => busy = false); }
}
window.addEventListener("message", e => {
  if (e.data.type !== "streamlit:render") return;
  const args = e.data.args;
  if (args.spec === spec) return;
  spec = args.spec; ohlc = args.ohlc;
  const newView = args.view || "1Y", changed = newView !== curView || !!args.intraday !== intraday;
  curView = newView; intraday = !!args.intraday; mode = args.mode || mode; K = intraday ? 16 : 10;
  const fig = JSON.parse(spec);
  if (!changed && div.layout && div.layout.xaxis && div.layout.xaxis.range) {          // a re-render after a save keeps your view
    Object.keys(fig.layout).filter(k => /^xaxis\d*$/.test(k))
      .forEach(k => fig.layout[k].range = div.layout.xaxis.range.slice());   // every shared x-axis, or they disagree
    if (div.layout.yaxis && div.layout.yaxis.range) fig.layout.yaxis.range = div.layout.yaxis.range.slice();
  }
  if (div._fullLayout && typeof div._fullLayout.dragmode === "string" && div._fullLayout.dragmode.startsWith("draw"))
    fig.layout.dragmode = div._fullLayout.dragmode;      // a drawing tool stays on through the save / redraw
  const cfg = Object.assign({}, fig.config || {}, {displaylogo: false, scrollZoom: false, displayModeBar: true,
    modeBarButtons: [["drawline", "drawrect", UNDO, REDO, DEL, "eraseshape"]]});
  Plotly.react(div, fig.data, fig.layout, cfg).then(() => {
    if (saving) { hist[hist.length - 1] = mine(); saving = false; }   // our own save coming back (same shapes, re-serialised)
    else if (JSON.stringify(mine()) !== JSON.stringify(hist[hist.length - 1])) hist.push(mine());   // first load, or a change made outside (Add level / Clear)
    send("streamlit:setFrameHeight", {height: fig.layout.height + 8});
    buildIndex(); applyMode(); paintButtons(); setTimeout(rescale, 0);
    if (changed && !intraday) { const r = RANGES.find(x => x[0] === curView); if (r && r[0] !== "1Y") setRange(r[0], r[1]); }
    show(idx.days[idx.days.length - 1]);
    if (div._sa) return; div._sa = true;
    div.on("plotly_relayout", ev => {
      if (busy) return;
      const k = Object.keys(ev);
      if (k.some(x => x.startsWith("xaxis"))) rescale();
      buildIndex();
      if (k.some(x => x.startsWith("shapes"))) record();
    });
  });
});
// TradingView-style read-out: a legend at the top-left of each panel, updated on mouse move, and a dotted crosshair
// with the price at the cursor on the right axis (no floating tooltip over the candles).
const fmt$ = v => "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const day = x => String(x).slice(0, K);
let idx = null;
function buildIndex() {
  const fd = div._fullData, fl = div._fullLayout; idx = {panels: {}, candle: null};
  if (ohlc) { const m = {}; ohlc.x.forEach((x, i) => m[day(x)] = i); idx.candle = Object.assign({_m: m}, ohlc); }
  fd.forEach(t => {
    if (t.hoverinfo !== "none" || t.type === "candlestick" || t.name === "Close line") return;   // OHLC comes from args
    const ax = t.yaxis || "y", m = {};
    t.x.forEach((x, i) => m[day(x)] = i); t._m = m;
    (idx.panels[ax] = idx.panels[ax] || []).push(t);
  });
  idx.days = idx.candle ? idx.candle.x.map(day) : [];
  idx.lg = {};
  const axes = ["y"].concat(Object.keys(idx.panels));
  div.querySelectorAll(".lg").forEach(el => { if (!axes.includes(el.dataset.ax)) el.remove(); });   // from the other view
  axes.forEach(ax => {
    let el = div.querySelector(`.lg[data-ax="${ax}"]`);
    if (!el) { el = document.createElement("div"); el.className = "lg"; el.dataset.ax = ax; div.appendChild(el); }
    const ya = fl[ax === "y" ? "yaxis" : "yaxis" + ax.slice(1)], sz = fl._size;
    el.style.left = (sz.l + 4) + "px"; el.style.top = (ya._offset + (ax === "y" ? 4 : 2)) + "px";
    idx.lg[ax] = el;
  });
}
function nearest(ms) {
  const d = idx.days; if (!d.length) return null; let lo = 0, hi = d.length - 1; const t = new Date(ms).toISOString().slice(0, K);
  while (lo < hi) { const m = (lo + hi) >> 1; if (d[m] < t) lo = m + 1; else hi = m; }
  if (lo > 0 && Math.abs(new Date(d[lo - 1]) - ms) < Math.abs(new Date(d[lo]) - ms)) lo--;
  return d[lo];
}
function show(key) {
  const c = idx.candle; if (!c || !key) return;
  const i = c._m[key];
  if (i !== undefined) {
    const o = +c.open[i], h = +c.high[i], l = +c.low[i], cl = +c.close[i], pc = i > 0 ? +c.close[i - 1] : o, ch = cl - pc;
    const k = ch >= 0 ? "up" : "dn", dt = new Date(intraday ? key + ":00" : key + "T12:00:00");
    const when = dt.toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"}) +
      (intraday ? " " + dt.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"}) + " ET" : "");
    let ma = (idx.panels["y"] || []).map(t => t._m[key] !== undefined && t.y[t._m[key]] != null ?
      `<span style="color:${t.line.color}">${t.name} ${fmt$(+t.y[t._m[key]])}</span>` : "").filter(Boolean).join(" &nbsp;");
    idx.lg.y.innerHTML = `<b>${when}</b> &nbsp;O <b class="${k}">${fmt$(o)}</b> H <b class="${k}">${fmt$(h)}</b> L <b class="${k}">${fmt$(l)}</b> C <b class="${k}">${fmt$(cl)}</b> <span class="${k}">${ch >= 0 ? "+" : ""}${ch.toFixed(2)} (${ch >= 0 ? "+" : ""}${(ch / pc * 100).toFixed(2)}%)</span>` + (ma ? "<br>" + ma : "");
  }
  Object.entries(idx.panels).forEach(([ax, ts]) => {
    if (ax === "y") return;
    idx.lg[ax].innerHTML = ts.map(t => { const j = t._m[key]; if (j === undefined || t.y[j] == null) return "";
      const v = +t.y[j], col = (t.line && t.line.color) || (t.marker && typeof t.marker.color === "string" ? t.marker.color : "#334155");
      const txt = t.name === "Volume" ? (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : (v / 1e3).toFixed(0) + "K") :
        t.name === "RSI" ? v.toFixed(1) : t.name.startsWith("MACD") ? v.toFixed(3) : (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
      return `<span style="color:${col}">${t.name} <b>${txt}</b></span>`; }).filter(Boolean).join(" &nbsp;");
  });
}
function crosshair(ev) {
  if (!idx) return;
  const fl = div._fullLayout, sz = fl._size, r = div.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  const H = document.getElementById("chh"), V = document.getElementById("chv"), Y = document.getElementById("chy");
  const inside = px >= sz.l && px <= sz.l + sz.w && py >= sz.t && py <= sz.t + sz.h;
  [H, V, Y].forEach(e => e.style.display = inside ? "block" : "none");
  if (!inside) { show(idx.days[idx.days.length - 1]); return; }
  V.style.left = px + "px"; V.style.top = sz.t + "px"; V.style.height = sz.h + "px";
  H.style.left = sz.l + "px"; H.style.width = sz.w + "px"; H.style.top = py + "px";
  // the y label: which panel is the cursor in, and its value there
  let label = null;
  Object.keys(fl).filter(k => /^yaxis\d*$/.test(k)).forEach(k => {
    const ya = fl[k], top = ya._offset, bot = ya._offset + ya._length;
    if (py >= top && py <= bot) { const v = ya.p2l(py - top); label = k === "yaxis" ? fmt$(v) : Math.abs(v) >= 1e5 ? (v / 1e6).toFixed(1) + "M" : v.toFixed(2); }
  });
  Y.style.display = label ? "block" : "none"; Y.textContent = label || "";
  Y.style.left = (sz.l + sz.w + 2) + "px"; Y.style.top = py + "px";
  show(nearest(+new Date(fl.xaxis.p2c(px - fl.xaxis._offset))));
}
div.addEventListener("mousemove", crosshair);
div.addEventListener("mouseleave", () => { ["chh", "chv", "chy"].forEach(i => document.getElementById(i).style.display = "none"); if (idx) show(idx.days[idx.days.length - 1]); });
// Range buttons: the last N months, filling the width (data to the right edge but for a small margin)
const INTRA = ["1D", "1W"];
const RANGES = [["1M", 1], ["3M", 3], ["6M", 6], ["1Y", 12], ["2Y", 24]], AHEAD = 0.015;   // a small margin after the last bar (share of the span); drawings can still reach the edge
const rng = document.getElementById("rng");
function setRange(label, m) {
  if (!idx || !idx.days.length) return;
  const last = new Date(idx.days[idx.days.length - 1] + "T00:00:00Z"), a = new Date(last), b = new Date(last);
  if (m) a.setUTCMonth(a.getUTCMonth() - m); else a.setTime(new Date(idx.days[0] + "T00:00:00Z").getTime());
  b.setTime(b.getTime() + (b - a) * AHEAD);
  curView = label; paintButtons();
  const r = [a.toISOString().slice(0, 10), b.toISOString().slice(0, 16).replace("T", " ")], upd = {};
  Object.keys(div._fullLayout).filter(k => /^xaxis\d*$/.test(k)).forEach(k => upd[k + ".range"] = r);   // shared axes: all
  Plotly.relayout(div, upd).then(() => { busy = false; rescale(); buildIndex(); });
}
function ask(view) { send("streamlit:setComponentValue", {value: {view, mode, t: Date.now()}, dataType: "json"}); }
INTRA.concat(RANGES.map(r => r[0])).forEach(l => {
  const b = document.createElement("button"); b.textContent = l; b.dataset.view = l;
  b.onclick = () => {
    if (INTRA.includes(l) || intraday) { if (l !== curView) ask(l); return; }     // other data: Python redraws
    const r = RANGES.find(x => x[0] === l); setRange(r[0], r[1]); ask(l);   // remembered for the session
  };
  rng.appendChild(b);
});
const sep = document.createElement("span"); sep.style.cssText = "width:10px"; rng.appendChild(sep);
["Candles", "Line"].forEach(l => { const b = document.createElement("button"); b.textContent = l; b.dataset.mode = l;
  b.onclick = () => { if (mode === l) return; mode = l; applyMode(); paintButtons();
    send("streamlit:setComponentValue", {value: {mode, t: Date.now()}, dataType: "json"}); };
  rng.appendChild(b); });
function paintButtons() {
  [...rng.querySelectorAll("button")].forEach(b => b.classList.toggle("on", b.dataset.view ? b.dataset.view === curView : b.dataset.mode === mode));
}
function applyMode() {   // Candles / Line: show one of the two price traces
  const ci = div.data.findIndex(t => t.type === "candlestick"), li = div.data.findIndex(t => t.name === "Close line");
  if (ci < 0 || li < 0) return;
  busy = true; Plotly.restyle(div, {visible: [mode === "Candles", mode === "Line"]}, [ci, li]).then(() => busy = false);
}

// Drawing history: every shape change is a snapshot; undo / redo step through them and save at once
const hist = [], redo = []; let replaying = false, saving = false;
function save() { saving = true; send("streamlit:setComponentValue", {value: {shapes: mine(), t: Date.now()}, dataType: "json"}); }
function record() {
  if (replaying) return;
  const now = mine();
  if (JSON.stringify(now) === JSON.stringify(hist[hist.length - 1])) return;
  hist.push(now); redo.length = 0; save();
}
function apply(state) {
  replaying = true;
  const sys = (div.layout.shapes || []).filter(s => s.name === "sys");
  Plotly.relayout(div, {shapes: sys.concat(JSON.parse(JSON.stringify(state)))}).then(() => { replaying = false; save(); });
}
const icon = p => ({width: 24, height: 24, path: p});
const UNDO = {name: "Undo", title: "Undo", icon: icon("M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"),
  click: () => { if (hist.length > 1) { redo.push(hist.pop()); apply(hist[hist.length - 1]); } }};
const REDO = {name: "Redo", title: "Redo", icon: icon("M11.5 8c2.65 0 5.05 1 6.9 2.6L22 7v9h-9l3.62-3.62A7.95 7.95 0 0 0 11.5 10.5c-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"),
  click: () => { if (redo.length) { const s = redo.pop(); hist.push(s); apply(s); } }};
const DEL = {name: "Delete", title: "Delete the selected drawing (or all drawings)", icon: icon("M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"),
  click: () => {
    const all = mine(), sel = div._fullLayout._activeShapeIndex;
    const own = sel !== undefined && sel !== null && (div.layout.shapes[sel] || {}).name !== "sys";
    if (!all.length) return;
    const ask = document.getElementById("ask");
    document.getElementById("askt").textContent = own ? "Delete the selected drawing?" : `Delete all ${all.length} drawing${all.length > 1 ? "s" : ""}?`;
    ask.style.display = "block";
    document.getElementById("askno").onclick = () => ask.style.display = "none";
    document.getElementById("askyes").onclick = () => {
      ask.style.display = "none";
      const keep = own ? mine().filter(s => JSON.stringify(s) !== JSON.stringify(JSON.parse(JSON.stringify(div.layout.shapes[sel])))) : [];
      hist.push(keep); redo.length = 0; apply(keep);
    };
  }};
send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
